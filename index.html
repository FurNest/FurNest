<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurNest — Home Pet Boarding in Miyapur, Hyderabad</title>
    <meta name="description" content="FurNest — cage-free home boarding for dogs, birds & other small pets in Miyapur, Hyderabad. Plus loving day care for your plants while you're away.">
    
    <!-- External Google Typography Layers -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #e67e22;
            --brand-dark: #1e293b;
            --whatsapp-green: #25d366;
            --bg-warm: #fbf9f6;
            --surface-white: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-warm);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Fixed Navigation Menu Layer */
        nav {
            background-color: var(--surface-white);
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .brand-logo {
            font-family: 'Fraunces', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--brand-dark);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo span {
            color: var(--primary-orange);
        }

        .nav-menu {
            display: flex;
            gap: 24px;
            list-style: none;
            align-items: center;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .nav-menu a:hover {
            color: var(--primary-orange);
        }

        /* Action Buttons Blocks */
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.25s ease;
            text-align: center;
            font-size: 1rem;
        }

        .btn-nav-cta {
            background-color: var(--brand-dark);
            color: var(--surface-white) !important;
            padding: 8px 20px;
            font-size: 0.9rem;
        }

        .btn-nav-cta:hover {
            background-color: var(--primary-orange);
        }

        .btn-booking {
            background-color: var(--primary-orange);
            color: var(--surface-white);
            box-shadow: 0 4px 14px rgba(230, 126, 34, 0.3);
        }

        .btn-whatsapp-cta {
            background-color: var(--whatsapp-green);
            color: var(--surface-white);
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            opacity: 0.95;
        }

        /* Hero Splash Banner Area */
        .hero-banner {
            padding: 90px 20px;
            text-align: center;
            background: radial-gradient(circle at top right, #fffdfa 0%, #f5ece3 100%);
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        .hero-inner {
            max-width: 850px;
            margin: 0 auto;
        }

        .location-tag {
            background-color: rgba(230, 126, 34, 0.08);
            color: var(--primary-orange);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hero-banner h1 {
            font-family: 'Fraunces', serif;
            font-size: 3.2rem;
            font-weight: 600;
            color: var(--brand-dark);
            line-height: 1.15;
            margin-bottom: 24px;
        }

        .hero-banner .hero-desc {
            font-size: 1.25rem;
            color: var(--text-light);
            margin-bottom: 40px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .action-flex {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .trust-score {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            color: var(--brand-dark);
        }

        .star-rating {
            color: #ffb400;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        /* Section Layout Modules */
        section {
            padding: 90px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-center {
            text-align: center;
            margin-bottom: 60px;
        }

        .header-center h2 {
            font-family: 'Fraunces', serif;
            font-size: 2.4rem;
            color: var(--brand-dark);
            margin-bottom: 12px;
        }

        .header-center p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        /* Feature Matrix (Services) */
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
        }

        .matrix-box {
            background-color: var(--surface-white);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.015);
            border: 1px solid rgba(0,0,0,0.01);
            transition: all 0.3s ease;
        }

        .matrix-box:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.04);
        }

        .matrix-icon {
            font-size: 2.8rem;
            margin-bottom: 20px;
            display: inline-block;
        }

        .matrix-box h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.4rem;
            color: var(--brand-dark);
            margin-bottom: 14px;
        }

        .matrix-box p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Roadmap Layout (Promises) */
        .roadmap-stack {
            max-width: 800px;
            margin: 0 auto;
        }

        .roadmap-row {
            display: flex;
            gap: 24px;
            background: var(--surface-white);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.01);
            align-items: center;
        }

        .roadmap-badge {
            background-color: var(--primary-orange);
            color: var(--surface-white);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .roadmap-text h4 {
            font-family: 'Fraunces', serif;
            color: var(--brand-dark);
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        .roadmap-text p {
            color: var(--text-light);
        }

        /* Review Grid Module */
        .testimonial-masonry {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .testimonial-card {
            background-color: var(--surface-white);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.015);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 4px solid var(--primary-orange);
        }

        .quote-msg {
            font-size: 1.05rem;
            font-style: italic;
            color: var(--brand-dark);
            margin: 20px 0;
            line-height: 1.7;
        }

        .profile-author {
            font-weight: 700;
            color: var(--brand-dark);
            font-size: 1rem;
            letter-spacing: 0.3px;
        }

        /* Site Base Footer */
        footer {
            background-color: var(--brand-dark);
            color: var(--surface-white);
            text-align: center;
            padding: 50px 20px;
        }

        footer p {
            opacity: 0.7;
            font-size: 0.95rem;
        }

        /* Responsiveness Adjustments */
        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .hero-banner h1 { font-size: 2.3rem; }
            .action-flex { flex-direction: column; }
            .btn { width: 100%; }
            .roadmap-row { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation System -->
    <nav>
        <div class="nav-container">
